[project]
name = "linuxdiskinfo"
version = "1.0.0"
description = "CrystalDiskInfo-style drive health monitor for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Palymer" }]
keywords = ["smart", "nvme", "ssd", "disk", "health", "crystaldiskinfo"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
linuxdiskinfo = "linuxdiskinfo.__main__:main"

[project.gui-scripts]
linuxdiskinfo-gui = "linuxdiskinfo.__main__:main"

[project.urls]
Homepage = "https://github.com/Palymer/LinuxDiskInfo"
Repository = "https://github.com/Palymer/LinuxDiskInfo"
Issues = "https://github.com/Palymer/LinuxDiskInfo/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linuxdiskinfo*"]

[tool.setuptools.package-data]
linuxdiskinfo = ["style.css"]
